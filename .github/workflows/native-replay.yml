name: Native protocol replay
on:
  pull_request:
    paths:
      - contract/bedrock-v2.md
      - contract/bedrock-v2.yaml
      - contract/bedrock-v2.schema.json
      - contract/tool-interface.md
      - contract/tool-interface.json
      - contract/tool-examples/**
      - contract/skills/**
      - contract/structural-skills/**
      - contract/roles.md
      - contract/examples/**
      - tests/test_replay_arguments.py
  # Replay-recipe changes without native-input changes can be qualified explicitly.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-replay:
    runs-on: {group: ci, labels: automation-test-xl}
    steps:
      - name: Exact protocol head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python for the pinned source runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Qualification toolchain
        run: python -m pip install 'uv==0.12.17'
      - name: Materialize matching source bytes from pinned images
        run: python3 contract/tool-examples/materialize_images.py --output .qualification
      - name: Real pinned PostgreSQL AGE API client projector replay
        run: |
          uv run --python 3.12 --no-project --with pyyaml --with jsonschema --with 'psycopg[binary,pool]' --with boto3 --with testcontainers python contract/tool-examples/replay.py --graph-source .qualification/graph --client-source .qualification/client --fixture-commit "$(git rev-parse HEAD)"
