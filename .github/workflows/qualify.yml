name: Protocol qualification
on:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: {group: ci, labels: automation-test-s}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Untouched source baseline
        run: |
          baseline_dir=$(mktemp -d /tmp/bedrock-baseline.XXXXXX)
          git archive 757905749f8cfb3176983cc0eec936ff190ffe97 | tar -x -C "$baseline_dir"
          cd "$baseline_dir"
          uv run --no-project --with pyyaml --with jsonschema python contract/check.py
      - name: Source semantics
        run: uv run --no-project --with pyyaml --with jsonschema python contract/check.py
      - name: Compiler and sentence boundary
        run: uv run --no-project --with pyyaml --with jsonschema python -m unittest discover -s tests -v
      - name: Manifest regeneration agrees byte for byte
        run: |
          cp manifest.json /tmp/qualified-manifest.json
          python3 compiler/generate_manifest.py
          cmp manifest.json /tmp/qualified-manifest.json
      - name: Lint workflows with actionlint and shellcheck
        run: |
          tools=$(mktemp -d /tmp/bedrock-lint.XXXXXX)
          curl --fail --location --silent --show-error --output "$tools/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$tools/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tools/actionlint.tar.gz" \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$tools/shellcheck.tar.xz" | sha256sum --check
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xJf "$tools/shellcheck.tar.xz" -C "$tools" --strip-components=1 shellcheck-v0.11.0/shellcheck
          PATH="$tools:$PATH" "$tools/actionlint" -color -shellcheck "$tools/shellcheck"
      - name: Project this repository's situation records twice
        run: |
          for run in 1 2; do
            python3 scripts/situation-projection.py --scope "$GITHUB_REPOSITORY" --output "situation-$run.md"
          done
          cmp situation-1.md situation-2.md
          head -n 8 situation-1.md
          rm situation-1.md situation-2.md
      - name: Compile the finite three-part example
        run: |
          python3 compiler/compile.py --protocol-root . --org-root examples/organisation --repository examples/repository.json --output /tmp/compiled-AGENTS.md
          python3 compiler/check_sentences.py --agents /tmp/compiled-AGENTS.md --skills contract/skills contract/structural-skills examples/organisation/skills
          cmp /tmp/compiled-AGENTS.md examples/compiled-AGENTS.md
  published-pair:
    runs-on: {group: ci, labels: automation-test-s}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Restore immutable published baseline
        id: baseline
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .qualification/bedrock-2.0.0.tar.gz
          key: published-bedrock-5be7e35e8390d1332bb660ace4b6233eef4c12b892f87cd504241d4baef2b9c2
      - name: Fetch baseline on cache miss
        if: steps.baseline.outputs.cache-hit != 'true'
        run: |
          mkdir -p .qualification
          curl --fail --location --output .qualification/bedrock-2.0.0.tar.gz https://github.com/cleverunicornz/yeetz-bedrock-protocol/releases/download/v2.0.0/bedrock-2.0.0.tar.gz
      - name: Verify archive digest and finite package compatibility
        run: python3 tests/probe_published_archive.py .qualification/bedrock-2.0.0.tar.gz
