name: Protocol qualification
on:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: {group: ci, labels: automation-test-s}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Untouched source baseline
        run: |
          baseline_dir=$(mktemp -d /tmp/bedrock-baseline.XXXXXX)
          git archive 757905749f8cfb3176983cc0eec936ff190ffe97 | tar -x -C "$baseline_dir"
          cd "$baseline_dir"
          uv run --no-project --with pyyaml --with jsonschema python contract/check.py
      - name: Source semantics
        run: uv run --no-project --with pyyaml --with jsonschema python contract/check.py
      - name: Compiler and sentence boundary
        run: uv run --no-project --with pyyaml --with jsonschema python -m unittest discover -s tests -v
      - name: Compile the finite three-part example
        run: |
          python3 compiler/compile.py --protocol-root . --org-root examples/organisation --repository examples/repository.json --output /tmp/compiled-AGENTS.md
          python3 compiler/check_sentences.py --agents /tmp/compiled-AGENTS.md --skills contract/skills contract/structural-skills examples/organisation/skills
          cmp /tmp/compiled-AGENTS.md examples/compiled-AGENTS.md
  physical-replay:
    runs-on: {group: ci, labels: automation-test-xl}
    steps:
      - name: Exact protocol head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python for the pinned source runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Qualification toolchain
        run: python -m pip install 'uv==0.12.17'
      - name: Materialize matching source bytes from pinned images
        run: python3 contract/tool-examples/materialize_images.py --output .qualification
      - name: Real pinned PostgreSQL AGE API client projector replay
        run: |
          uv run --python 3.12 --no-project --with pyyaml --with jsonschema --with 'psycopg[binary,pool]' --with boto3 --with testcontainers python contract/tool-examples/replay.py --graph-source .qualification/graph --client-source .qualification/client --fixture-commit "$(git rev-parse HEAD)"
