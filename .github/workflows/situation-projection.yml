# Reusable Bedrock check: on a pull request of a public repository, SITUATION.md is the deterministic projection of
# the repository's situation records (contract section 8), built by scripts/situation-projection.py of the protocol
# release the repository adopts and committed to the pull request's head when it changed. A private repository
# carries no projection and the job is skipped. Until the situation domain holds the repository's records, the
# projection's source is the repository's own situation/ files.
#
#   on: pull_request
#   jobs:
#     situation:
#       permissions:
#         contents: write
#       uses: cleverunicornz/yeetz-bedrock-protocol/.github/workflows/situation-projection.yml@v2.1.0
#       with:
#         version: 2.1.0
#       secrets:
#         push_token: ${{ secrets.SITUATION_PUSH_TOKEN }}
#
# A push made with the job's GITHUB_TOKEN starts no workflow, so the projection commit would carry no checks; pass
# push_token (a token that can push to the repository) so the caller's checks run again on the new head.
name: SITUATION.md projection
on:
  workflow_call:
    inputs:
      version:
        description: Protocol release (2.minor.patch, minor 1 or later) whose scripts/situation-projection.py builds SITUATION.md.
        required: true
        type: string
      runs-on:
        description: The job's runs-on value as JSON, for example '"ubuntu-latest"' or '{"group":"ci","labels":"automation-test-s"}'.
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      push_token:
        description: Token that can push to the repository; its push starts the pull request's checks on the new head.
        required: false
permissions:
  contents: write
jobs:
  projection:
    name: SITUATION.md is the current projection
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    concurrency:
      group: situation-projection-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_BASE: https://github.com/cleverunicornz/yeetz-bedrock-protocol/releases/download/v${{ inputs.version }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HAS_PUSH_TOKEN: ${{ secrets.push_token != '' }}
    steps:
      - name: Protocol release
        run: |
          if [[ ! "$VERSION" =~ ^2\.[1-9][0-9]*\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be a Bedrock protocol release 2.<minor>.<patch> from 2.1.0, got '$VERSION'"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.push_token || github.token }}
          path: repository
          fetch-depth: 0
          persist-credentials: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Fetch and verify the protocol release
        run: |
          set -euo pipefail
          mkdir -p release
          curl --fail --location --silent --show-error --output release/SHA256SUMS "$RELEASE_BASE/SHA256SUMS"
          curl --fail --location --silent --show-error --output "release/bedrock-$VERSION.tar.gz" "$RELEASE_BASE/bedrock-$VERSION.tar.gz"
          awk -v name="bedrock-$VERSION.tar.gz" '$2 == name' release/SHA256SUMS > release/archive.sha256
          if [ "$(wc -l < release/archive.sha256)" -ne 1 ]; then
            echo "::error::SHA256SUMS of release v$VERSION does not name bedrock-$VERSION.tar.gz once"
            exit 1
          fi
          (cd release && sha256sum --check --strict archive.sha256)
          tar -xzf "release/bedrock-$VERSION.tar.gz"
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root, version = Path("bedrock"), os.environ["VERSION"]
          manifest = json.loads((root / "manifest.json").read_text())
          if manifest.get("version") != version or (root / "VERSION").read_text().strip() != version:
              sys.exit(f"release v{version}: manifest or VERSION names another version")
          def entries(value):
              if isinstance(value, dict):
                  if "path" in value:
                      yield value
                  else:
                      for child in value.values():
                          yield from entries(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from entries(child)
          published = set()
          for entry in entries(manifest):
              if hashlib.sha256((root / entry["path"]).read_bytes()).hexdigest() != entry["sha256"]:
                  sys.exit(f"release v{version}: {entry['path']} differs from its manifest digest")
              published.add(entry["path"])
          for needed in ("templates/repository-block.md", "scripts/check-agents-md.py", "scripts/situation-projection.py"):
              if needed not in published:
                  sys.exit(f"release v{version} does not publish {needed}")
          print(f"verified protocol release v{version}: {len(published)} published files")
          PY
      - name: Project the situation records
        run: python3 bedrock/scripts/situation-projection.py --root repository --scope "$GITHUB_REPOSITORY" --output SITUATION.md
      - name: Commit the projection to the pull request head
        working-directory: repository
        run: |
          if git ls-files --error-unmatch SITUATION.md >/dev/null 2>&1 && git diff --quiet -- SITUATION.md; then
            echo "SITUATION.md is current"
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            git diff --stat -- SITUATION.md || true
            echo "::error file=SITUATION.md::SITUATION.md is stale and this pull request comes from a fork, so it cannot be committed here. Build it with scripts/situation-projection.py from bedrock-$VERSION.tar.gz of Bedrock protocol release v$VERSION (python3 bedrock/scripts/situation-projection.py --root <your checkout> --scope $GITHUB_REPOSITORY --output SITUATION.md), commit it to the pull request and push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SITUATION.md
          git commit -q -m "Project SITUATION.md from the situation records" \
            -m "Built by scripts/situation-projection.py of Bedrock protocol release $VERSION; a projection, not a source of truth."
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "::notice file=SITUATION.md::committed the projection as $(git rev-parse HEAD)"
          if [ "$HAS_PUSH_TOKEN" != true ]; then
            echo "::warning::pushed with GITHUB_TOKEN, which starts no workflow: the new head carries no checks until another push or a manual run; pass push_token"
          fi
      - name: SITUATION.md is current
        run: python3 bedrock/scripts/situation-projection.py --root repository --scope "$GITHUB_REPOSITORY" --check
