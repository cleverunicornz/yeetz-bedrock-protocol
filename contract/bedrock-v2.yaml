# Bedrock v2 machine-readable contract (DRAFT).
#
# The prose in contract/bedrock-v2.md and this file state the same contract;
# contract/check.py proves they agree with each other, with
# contract/bedrock-v2.schema.json, and with the worked examples in
# contract/examples/. Storage-neutral: nothing here names a database, a query
# language, or a vendor.

bedrock: 2.0.0-draft
status: draft

parameters:
  # The author may amend its own record for this long after the act that made
  # it; afterwards only supersede or revoke. Measured from the making act's
  # recorded_at; amendments do not extend it. A lower layer may shorten it,
  # never lengthen it.
  edit_window_seconds: 600
  # The tool returns these on the making act and on every amendment.
  edit_window_feedback: [edit_window_closes_at, edit_window_seconds_left]

# Field limits, in characters (the enforcement unit). "title" is about 120
# characters; "text" about 200 tokens; "result" about 100 tokens. An
# oversized write is refused with the field, its size and the limit; nothing
# is cut silently. A lower layer may tighten a limit, never loosen it.
limits:
  title: 120
  text: 800
  result: 400

levels:
  # Level is a property of every act and record: where it applies. No forced
  # hierarchy; belonging is an optional `relate ... belongs_to` link.
  initial: [board, repository, system, organisation, bedrock]
  values_added_by: [organisation]

layers:
  # Where rules come from (distinct from levels, which say where records
  # apply). Each layer adds and specialises; none redefines a lower layer.
  order: [bedrock, organisation, repository, runtime]
  bedrock_only:
    - the nouns, the Plan group and the structural acts
    - the verbs and what each means
    - the states and the transitions
    - the act envelope and lineage fields
    - the reference kinds
    - the judge rule
  may_add:
    organisation: [level values, roles mapped onto Bedrock roles, visibility values, verb procedures (skills), shorter edit window, tighter limits]
    repository: [scope names, judging additions in repository skills, repository procedures]
    runtime: [board records, a session's own Plans]
  redefinition: a Bedrock change

nouns:
  Invariant:
    prefix: I
    states: [in_force, superseded, revoked]
    made_by: stipulate
    fields: {title: title, rule: text, priority: [critical, standard]}
    links: {basis: [Decision, Reference, Witness, Invariant]}
  Gap:
    prefix: G
    states: [open, addressing, closed, tolerated, superseded, revoked]
    made_by: declare
    fields: {title: title, statement: text, impact: "text?"}
    links: {arose_in: act, about: any}
  Candidate:
    prefix: C
    states: [formulated, evaluating, evaluated, accepted, declined, superseded, revoked]
    made_by: formulate
    fields: {title: title, hypothesis: text}
    links: {responds_to: [Gap, Witness, Decision, Reference, Candidate]}
  Decision:
    prefix: D
    states: [in_force, superseded, revoked]
    made_by: decide
    fields: {title: title, statement: text, why: text, rejected: "[{alternative: title, why: text}]?", revisit_when: "text?"}
    links: {considered: any, outcomes: [Candidate, Gap]}
  Promise:
    prefix: P
    states: [asserted, assuring, assured, superseded, revoked]
    made_by: mint
    fields: {title: title, statement: text, scope: text, residual: "text?"}
    links: {basis: [Decision, Reference], from_candidate: Candidate, addresses: Gap}
  Oracle:
    prefix: O
    states: [in_force, superseded, revoked]
    made_by: define
    fields: {title: title, inputs: text, holds_when: text, fails_when: text, arrangement: [human, agent, deterministic, mixed], executable: "pointer?"}
    links: {judges: Promise}
  Witness:
    prefix: W
    states: [produced, judged, revoked]
    made_by: produce
    fields: {title: title, observed_at: date-time, coordinate: title, result: result}
    links: {observes: Promise, evidence: Reference, refines: Witness}
  Reference:
    prefix: R
    states: [current, superseded, revoked]
    made_by: store
    fields: {title: title, kind: [artifact, repository_file, website], media_type: string, digest: "sha256?", location: by kind, conversion: "provenance?", visibility: string}
    links: {}

group:
  Plan:
    prefix: PLAN
    members: [Candidate, Promise]
    fields: {title: title, members: ids, waits_on: "[{member, upon}] optional, loose, never required"}
    states: [open, retired]
    made_by: group
    completion: derived from member states; a Plan asserts nothing

verbs:
  stipulate:
    kind: act
    acts_on: [Invariant]
    inputs: [basis]
    outputs: [Invariant]
    roles: [authority]
    when: A binding rule is needed in a scope; a Decision is optional basis.
  declare:
    kind: act
    acts_on: [Gap]
    inputs: [about, arose_in]
    outputs: [Gap]
    roles: [authority, orchestrator, scout, implementer, validator, advisor, automation]
    when: An absence, concern or uncertainty is met, at its actual certainty. Never assigns its resolution.
  formulate:
    kind: act
    acts_on: [Candidate, Gap]
    inputs: [responds_to]
    outputs: [Candidate]
    roles: [authority, orchestrator, scout, implementer, advisor, automation]
    when: Evidence suggests a possible response. Walk the scope first; refine or supersede an existing Candidate instead of duplicating it.
  evaluate:
    kind: act
    acts_on: [Candidate]
    inputs: [Candidate]
    outputs: [findings, outcome]
    roles: [orchestrator, scout, advisor]
    when: A Candidate needs investigation before decide. May be recorded as begun, then completed.
  decide:
    kind: act
    acts_on: [Decision, Candidate, Gap]
    inputs: [considered]
    outputs: [Decision, outcomes]
    roles: [authority]
    when: A choice collapses. Records the disposition and grounds; never mints implicitly.
  mint:
    kind: act
    acts_on: [Promise, Gap]
    inputs: [basis, from_candidate, addresses]
    outputs: [Promise]
    roles: [authority, orchestrator]
    when: A commitment is accepted, from an instruction or specification (direct) or from a Candidate accepted by a Decision.
  define:
    kind: act
    acts_on: [Oracle, Promise]
    inputs: [Promise]
    outputs: [Oracle]
    roles: [authority, orchestrator]
    when: A Promise needs its judgment rule; best before produce; a retrospective Oracle is honest about its time.
  produce:
    kind: act
    acts_on: [Witness, Promise]
    inputs: [Promise, evidence]
    outputs: [Witness]
    roles: [implementer]
    when: A real run observed the Promise's subject. No verdict is attached.
  refine:
    kind: act
    acts_on: [Witness, Gap, Candidate]
    inputs: [target, evidence]
    outputs: [Witness, sighting]
    roles: [implementer, automation]
    when: Add without changing a claim - a better Witness after an inconclusive verdict, or a further sighting on a Gap or Candidate.
  judge:
    kind: act
    acts_on: [Witness]
    inputs: [Promise, Oracle, Witness]
    outputs: [verdict]
    roles: [validator]
    when: A Witness of a Promise exists and the Promise has an Oracle in force.
  assure:
    kind: transition
    acts_on: [Promise]
    inputs: [judge]
    outputs: [assured]
    roles: []
    when: Not performed. Recorded as the state change of a judge act whose verdict is holds, against the Oracle in force, while the Promise is assuring.
  revoke:
    kind: act
    acts_on: [Invariant, Gap, Candidate, Decision, Promise, Oracle, Witness, Reference]
    inputs: [target, basis]
    outputs: [revoked]
    roles: [authority, orchestrator, automation]
    when: A record is withdrawn with a reason after its edit window; history stays.
  supersede:
    kind: act
    acts_on: [Invariant, Gap, Candidate, Decision, Promise, Oracle, Reference]
    inputs: [target, successor, basis]
    outputs: [superseded]
    roles: [authority, orchestrator, automation]
    when: A record is replaced by a successor of the same noun, made first by its own verb; Witnesses are refined, never superseded.

structural_acts:
  # Recorded with the same envelope and lineage as verbs, by anyone. They
  # make nothing true: a Reference is depth, a Plan only groups, a relation is
  # optional scope, an amendment is a correction inside the edit window.
  store: {makes: Reference}
  group: {makes: Plan}
  regroup: {changes: Plan, does: [add or remove members, add or remove waits_on links, retire]}
  relate: {links: [scope, record], relations: [belongs_to, about], removable: true}
  amend: {changes: the author's own act payload, within: edit_window_seconds}

decision_outcomes:
  # Outcome -> resulting state of the subject (null: recorded, no state change)
  Candidate: {accept: accepted, decline: declined, defer: null, investigate: null}
  Gap: {close: closed, tolerate: tolerated, keep_open: null}

transitions:
  # from: [] means the record is made by the act.
  - {noun: Invariant, from: [], to: in_force, by: [stipulate]}
  - {noun: Invariant, from: [in_force], to: superseded, by: [supersede]}
  - {noun: Invariant, from: [in_force], to: revoked, by: [revoke]}
  - {noun: Gap, from: [], to: open, by: [declare]}
  - {noun: Gap, from: [open], to: addressing, by: [formulate, mint]}
  - {noun: Gap, from: [open, addressing], to: closed, by: [decide]}
  - {noun: Gap, from: [open, addressing], to: tolerated, by: [decide]}
  - {noun: Gap, from: [open, addressing], to: superseded, by: [supersede]}
  - {noun: Gap, from: [open, addressing], to: revoked, by: [revoke]}
  - {noun: Candidate, from: [], to: formulated, by: [formulate]}
  - {noun: Candidate, from: [formulated, evaluated], to: evaluating, by: [evaluate]}
  - {noun: Candidate, from: [formulated, evaluating, evaluated], to: evaluated, by: [evaluate]}
  - {noun: Candidate, from: [formulated, evaluating, evaluated], to: accepted, by: [decide]}
  - {noun: Candidate, from: [formulated, evaluating, evaluated], to: declined, by: [decide]}
  - {noun: Candidate, from: [formulated, evaluating, evaluated], to: superseded, by: [supersede]}
  - {noun: Candidate, from: [formulated, evaluating, evaluated], to: revoked, by: [revoke]}
  - {noun: Decision, from: [], to: in_force, by: [decide]}
  - {noun: Decision, from: [in_force], to: superseded, by: [supersede]}
  - {noun: Decision, from: [in_force], to: revoked, by: [revoke]}
  - {noun: Promise, from: [], to: asserted, by: [mint]}
  - {noun: Promise, from: [asserted], to: assuring, by: [define, produce]}
  - {noun: Promise, from: [assuring], to: assured, by: [assure]}
  - {noun: Promise, from: [asserted, assuring, assured], to: superseded, by: [supersede]}
  - {noun: Promise, from: [asserted, assuring, assured], to: revoked, by: [revoke]}
  - {noun: Oracle, from: [], to: in_force, by: [define]}
  - {noun: Oracle, from: [in_force], to: superseded, by: [supersede]}
  - {noun: Oracle, from: [in_force], to: revoked, by: [revoke]}
  - {noun: Witness, from: [], to: produced, by: [produce, refine]}
  - {noun: Witness, from: [produced], to: judged, by: [judge]}
  - {noun: Witness, from: [produced, judged], to: revoked, by: [revoke]}
  - {noun: Reference, from: [], to: current, by: [store]}
  - {noun: Reference, from: [current], to: superseded, by: [supersede]}
  - {noun: Reference, from: [current], to: revoked, by: [revoke]}

judge_rule:
  input: the Promise as stated, its Oracle in force, one Witness of that Promise
  verdicts:
    holds: the Witness shows the Promise holds within its scope
    does_not_hold: a demonstrated failure within scope, cited as failure_evidence
    inconclusive: a verdict on the Witness, not the Promise; leads to refine
  positive_space_only: true
  gaps: declared as separate declare acts with arose_in = the judge act; binding as findings, closed only by decide, never gating
  hypothetical_failure: a Gap, never does_not_hold

act_envelope:
  # Every act, verb or structural, is a node carrying these fields.
  required: [id, protocol, verb, level, scope, recorded_at, actor, session, payload]
  optional: [tool_call, turn, repository, batch, edit_window_closes_at]
  actor:
    required: [kind, agent]
    optional: [role, principal]
    kind: [human, agent, tool]
    role: stamped by the runtime from what executes the agent; never set by the agent; not enforced
    principal: stamped from the caller's key
  pointers:
    session: the session in the transcript store
    tool_call: the tool call in that session, where known
    turn: the turn in that session, where known
  joins: through the two services' interfaces by these pointers, never by copying transcript data into the graph
  batch: acts submitted together share a batch id and are recorded together; each keeps its own node and meaning
  authority: the act log is authoritative; records, states and links are a projection of it, rebuilt by one projector

roles:
  # Guidance, not enforcement. At board level, a board's owner performs any
  # verb on its own board's records. Drift is measured, never blocked.
  authority: {verbs: [stipulate, declare, formulate, decide, mint, define, revoke, supersede]}
  orchestrator: {verbs: [declare, formulate, evaluate, mint, define, revoke, supersede]}
  scout: {verbs: [declare, formulate, evaluate]}
  implementer: {verbs: [declare, formulate, produce, refine]}
  validator: {verbs: [judge, declare]}
  advisor: {verbs: [declare, formulate, evaluate]}
  automation: {verbs: [declare, formulate, refine, revoke, supersede], note: revoke and supersede only Candidates still undecided}

references:
  kinds:
    artifact: {location: [stored], note: an object in the versioned object store; agents upload and read through the tool and never handle store keys}
    repository_file: {location: [repository, commit, path], note: any repository, pinned to a commit}
    website: {location: [url, retrieved_at, stored], note: a markdown extraction stored at the moment of reading; conversion provenance required}
  first_slice_media_types: [text/markdown]
  pinning: every Reference is immutable; a change is a new Reference that supersedes it (artifact - store version and sha256 digest; repository_file - commit; website - stored extraction and retrieval time)
  conversion: [tool, tool_version, converted_at, from_media_type, source]
  visibility: an organisation-defined value; default shared

drift_signals:
  # Measured from the act log; never a block.
  - verb performed by a role that does not hold it
  - judging rounds per Promise
  - Gaps declared per judgment
  - Gaps never dispositioned by decide
  - a judge act by the producer of the judged Witness above board level
  - amendments per act and acts amended near the window's end
  - sessions with acts but no board, or a board that does not match the session's brief

queries:
  by_state:
    params: [noun, states, "level?", "scope?"]
    answers: Records of one noun in the given states.
  relations:
    params: [id]
    answers: A record's links in and out, each with the act that made it.
  binds:
    params: [scope]
    answers: Invariants in force for the scope and every scope it is related to by belongs_to.
  open_work:
    params: [scope]
    answers: Gaps open or addressing, Candidates undecided, Promises asserted or assuring, Witnesses produced and not judged.
  assured_by:
    params: [promise]
    answers: The judge act, Oracle and Witness that assured the Promise, and judge acts since.
  unjudged_witnesses:
    params: [scope]
    answers: Witnesses still produced, with their Promise.
  gaps_without_candidate:
    params: [scope]
    answers: Gaps open with no Candidate responding and no Promise addressing.
  contradicted:
    params: [scope]
    answers: Assured Promises with a later does_not_hold judgment under the Oracle in force.
  plan_view:
    params: [plan]
    answers: Members, their states and their waits_on links.
  how_did_we_get_here:
    params: [id]
    answers: The path of acts backward from a record through its inputs - Decisions, Candidates, Gaps, instructions and judgments.
  what_changed_since:
    params: [cursor, "scope?"]
    answers: Acts recorded after the cursor within the reader's reach, oldest first; the reader keeps its own last-seen cursor.
  transcript_behind:
    params: [act]
    answers: The act's session, turn and tool-call pointers, for the transcript store to resolve.
  drift:
    params: [scope, since]
    answers: The drift signals, counted.
